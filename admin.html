<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Myranda Pratas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f7f1e8;
      color: #3d2c25;
      font-family: Arial, sans-serif;
    }

    .login {
      width: 100%;
      max-width: 420px;
      background: #fffdf9;
      border: 1px solid #e6d9ca;
      border-radius: 24px;
      padding: 42px 32px;
      box-shadow: 0 18px 50px rgba(67, 43, 31, 0.12);
    }

    .marca {
      text-align: center;
      margin-bottom: 36px;
    }

    .marca small {
      display: block;
      font-size: 11px;
      letter-spacing: 4px;
      margin-bottom: 6px;
    }

    .marca h1 {
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: normal;
      letter-spacing: 3px;
    }

    .marca p {
      margin-top: 10px;
      color: #806f66;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9cabc;
      border-radius: 12px;
      background: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #5a3a2e;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 999px;
      background: #5a3a2e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #3d261e;
    }

    .seguranca {
      margin-top: 22px;
      text-align: center;
      color: #806f66;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<main class="login" id="telaLogin">

    <div class="marca">
      <small>MYRANDA</small>
      <h1>PRATAS</h1>
      <p>Painel Administrativo</p>
    </div>

    <form id="loginForm">

      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        placeholder="Digite seu e-mail"
        autocomplete="email"
        required
      >

      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Entrar
      </button>

    </form>

    <div class="seguranca">
      🔒 Acesso restrito à administração da Myranda Pratas
    </div>

  </main><section id="painelAdmin" style="display:none; width:100%; max-width:1000px;">

  <div style="
    background:#fffdf9;
    border:1px solid #e6d9ca;
    border-radius:24px;
    padding:30px;
    box-shadow:0 18px 50px rgba(67,43,31,.12);
  ">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
    ">

      <div>
        <small style="letter-spacing:3px;">MYRANDA PRATAS</small>
        <h2 style="font-family:Georgia,serif; margin-top:6px;">
          Painel Administrativo
        </h2>
        <p style="color:#806f66; margin-top:6px;">
          Gerencie os produtos do catálogo
        </p>
      </div>

      <button
        id="btnSair"
        type="button"
        style="width:auto; margin:0; padding:12px 22px;"
      >
        Sair
      </button>

    </div>

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:25px;
      flex-wrap:wrap;
    ">

      <h3>Produtos</h3>

      <button

        id="btnNovoProduto"
        type="button"
        style="width:auto; margin:0; padding:12px 22px;"
      >
        + Novo produto
      </button>

    </div>

   <div id="formNovoProduto" style="
  display:none;
  background:#f8f3ec;
  border:1px solid #e6d9ca;
  border-radius:18px;
  padding:22px;
  margin-bottom:25px;
">

  <h3 style="margin-bottom:18px;">Novo produto</h3>

  <form id="novoProdutoForm">

    <label for="produtoCodigo">Código</label>
    <input id="produtoCodigo" type="text" placeholder="Ex: AN024" required>

    <label for="produtoNome">Nome</label>
    <input id="produtoNome" type="text" placeholder="Ex: Anel Coração" required>

    <label for="produtoPreco">Preço</label>
    <input id="produtoPreco" type="number" step="0.01" min="0" placeholder="49.90" required>

    <label for="produtoCategoria">Categoria</label>
    <select id="produtoCategoria" required style="
      width:100%;
      padding:14px;
      border:1px solid #d9cabc;
      border-radius:12px;
      background:white;
      font-size:15px;
      margin-top:7px;
    ">
      <option value="">Selecione uma categoria</option>
      <option value="Aneis">Anéis</option>
      <option value="Brincos">Brincos</option>
      <option value="Colares">Colares</option>
      <option value="Pulseiras">Pulseiras</option>
      <option value="Conjuntos">Conjuntos</option>
      <option value="Novidades">Novidades</option>
    </select>

    <label for="produtoFoto">Foto do produto</label>
<input
  id="produtoFoto"
  type="file"
  accept="image/jpeg,image/png,image/webp"
>
    <label for="produtoEstoque">Estoque</label>
    <input id="produtoEstoque" type="number" min="0" value="1" required>

    <div style="margin-top:20px;">
      <label style="display:flex; align-items:center; gap:10px;">
        <input id="produtoDisponivel" type="checkbox" checked style="width:auto;">
        Produto disponível
      </label>

      <label style="display:flex; align-items:center; gap:10px;">
        <input id="produtoDestaque" type="checkbox" style="width:auto;">
        Produto em destaque
      </label>
    </div>

    <div style="display:flex; gap:10px; margin-top:22px;">
      <button type="submit" style="margin:0;">
        Salvar produto
      </button>

      <button
        id="btnCancelarProduto"
        type="button"
        style="margin:0; background:#806f66;"
      >
        Cancelar
      </button>
    </div>

  </form>

</div>
    <div id="listaProdutos">
      <p style="color:#806f66;">
        Carregando produtos...
      </p>
    </div>

  </div>

</section>
<script>
  const SUPABASE_URL = "https://rrzsymawplobtgiefqed.supabase.co";
  const SUPABASE_KEY = "sb_publishable_zlv5ZXiuoUFR80E_zeHfwg_8oAMLkVV";

  const loginForm = document.getElementById("loginForm");
  const botaoEntrar = loginForm.querySelector("button");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;

    botaoEntrar.disabled = true;
    botaoEntrar.textContent = "Entrando...";

    try {
      const resposta = await fetch(
        `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },
          body: JSON.stringify({
            email: email,
            password: senha
          })
        }
      );

      const dados = await resposta.json();

      if (!resposta.ok) {
        throw new Error(dados.error_description || dados.msg || "E-mail ou senha incorretos.");
      }

      localStorage.setItem("myranda_access_token", dados.access_token);
      localStorage.setItem("myranda_refresh_token", dados.refresh_token);

      mostrarPainel();

    } catch (erro) {
      alert(erro.message);
    } finally {
      botaoEntrar.disabled = false;
      botaoEntrar.textContent = "Entrar";
    }
  });
const telaLogin = document.getElementById("telaLogin");
const painelAdmin = document.getElementById("painelAdmin");

async function mostrarPainel() {
  telaLogin.style.display = "none";
  painelAdmin.style.display = "block";
  await carregarProdutos();
}

document.getElementById("btnSair").addEventListener("click", () => {
  localStorage.removeItem("myranda_access_token");
  localStorage.removeItem("myranda_refresh_token");

  painelAdmin.style.display = "none";
  telaLogin.style.display = "block";

  document.getElementById("senha").value = "";
});
let produtosCarregados = [];
let produtoEmEdicaoId = null;
  async function carregarProdutos() {
  const lista = document.getElementById("listaProdutos");

  lista.innerHTML = "<p>Carregando produtos...</p>";

  try {
    const resposta = await fetch(
      `${SUPABASE_URL}/rest/v1/produtos?select=*&order=id.asc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${localStorage.getItem("myranda_access_token")}`
        }
      }
    );

    if (!resposta.ok) {
      throw new Error("Não foi possível carregar os produtos.");
    }

    const produtos = await resposta.json();
    produtosCarregados = produtos;

    if (produtos.length === 0) {
      lista.innerHTML = "<p>Nenhum produto cadastrado.</p>";
      return;
    }

    lista.innerHTML = produtos.map(produto => `
      <div style="
        border:1px solid #e6d9ca;
        border-radius:16px;
        padding:16px;
        margin-bottom:12px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:16px;
        flex-wrap:wrap;
      ">

        <div style="display:flex; align-items:center; gap:14px;">

          ${
            produto.imagem_url
              ? `<img
                   src="${produto.imagem_url}"
                   alt="${produto.nome}"
                   style="
                     width:70px;
                     height:70px;
                     object-fit:cover;
                     border-radius:12px;
                   "
                 >`
              : `<div style="
                   width:70px;
                   height:70px;
                   background:#f3ebe1;
                   border-radius:12px;
                   display:flex;
                   align-items:center;
                   justify-content:center;
                   font-size:11px;
                   color:#806f66;
                 ">Sem foto</div>`
          }

          <div>
            <strong>${produto.nome}</strong>

            <div style="font-size:13px; color:#806f66; margin-top:5px;">
              ${produto.codigo} • ${produto.categoria}
            </div>

            <div style="margin-top:6px;">
              R$ ${Number(produto.preco).toFixed(2).replace(".", ",")}
              • Estoque: ${produto.estoque}
            </div>
          </div>

        </div>

        <div>
          <span style="
            font-size:12px;
            font-weight:bold;
            color:${produto.disponivel ? "#48764f" : "#9b4b45"};
          ">
            ${produto.disponivel ? "DISPONÍVEL" : "INDISPONÍVEL"}
          </span>
          <button
  type="button"
  class="btnEditarProduto"
  data-id="${produto.id}"
  style="
    width:auto;
    margin:10px 0 0;
    padding:9px 18px;
    font-size:13px;
  "
>
  Editar
</button>
<button
  type="button"
  class="btnExcluirProduto"
  data-id="${produto.id}"
  style="
    width:auto;
    margin:10px 0 0 8px;
    padding:9px 18px;
    font-size:13px;
    background:#8b3f3f;
  "
>
  Excluir
</button>
        </div>

      </div>
    `).join("");

  } catch (erro) {
    console.error(erro);

    lista.innerHTML = `
      <p style="color:#9b4b45;">
        Erro ao carregar os produtos.
      </p>
    `;
  }
}
document.getElementById("novoProdutoForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const botaoSalvar = event.target.querySelector('button[type="submit"]');

  const codigo = document.getElementById("produtoCodigo").value.trim();
  const nome = document.getElementById("produtoNome").value.trim();
  const preco = Number(document.getElementById("produtoPreco").value);
  const categoria = document.getElementById("produtoCategoria").value;
  const foto = document.getElementById("produtoFoto").files[0];
  const estoque = Number(document.getElementById("produtoEstoque").value);
  const disponivel = document.getElementById("produtoDisponivel").checked;
  const destaque = document.getElementById("produtoDestaque").checked;

  botaoSalvar.disabled = true;
  botaoSalvar.textContent = "Salvando...";

  try {
    const token = localStorage.getItem("myranda_access_token");

    if (!token) {
      throw new Error("Sua sessão expirou. Saia do painel e entre novamente.");
    }
   let imagemUrl = produtoEmEdicaoId
  ? produtosCarregados.find(item => Number(item.id) === Number(produtoEmEdicaoId))?.imagem_url || null
  : null;

if (foto) {
  const extensao = foto.name.split(".").pop().toLowerCase();
  const nomeArquivo = `${Date.now()}-${codigo}.${extensao}`;

  const respostaUpload = await fetch(
    `${SUPABASE_URL}/storage/v1/object/produtos/${nomeArquivo}`,
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${token}`,
        "Content-Type": foto.type
      },
      body: foto
    }
  );

  if (!respostaUpload.ok) {
    const erroUpload = await respostaUpload.text();
    console.error(erroUpload);
    throw new Error("Não foi possível enviar a foto do produto.");
  }

  imagemUrl = `${SUPABASE_URL}/storage/v1/object/public/produtos/${nomeArquivo}`;
}

    const resposta = await fetch(
     produtoEmEdicaoId
  ? `${SUPABASE_URL}/rest/v1/produtos?id=eq.${produtoEmEdicaoId}`
  : `${SUPABASE_URL}/rest/v1/produtos`,
      {
      method: produtoEmEdicaoId ? "PATCH" : "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${token}`,
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          codigo: codigo,
          nome: nome,
          preco: preco,
          categoria: categoria,
          estoque: estoque,
          disponivel: disponivel && estoque > 0,
          destaque: destaque,
          imagem_url: imagemUrl
        })
      }
    );

    const dados = await resposta.json();

    if (!resposta.ok) {
      console.error(dados);
      throw new Error(dados.message || "Não foi possível cadastrar o produto.");
    }

  alert(produtoEmEdicaoId ? "Produto atualizado com sucesso!" : "Produto cadastrado com sucesso!");

  produtoEmEdicaoId = null;
formNovoProduto.querySelector("h3").textContent = "Novo produto";
    event.target.reset();
    document.getElementById("produtoDisponivel").checked = true;
    formNovoProduto.style.display = "none";

    await carregarProdutos();

  } catch (erro) {
    alert(erro.message);
  } finally {
    botaoSalvar.disabled = false;
    botaoSalvar.textContent = "Salvar produto";
  }
});
  const formNovoProduto = document.getElementById("formNovoProduto");
  document.getElementById("listaProdutos").addEventListener("click", (event) => {
  const botaoEditar = event.target.closest(".btnEditarProduto");

  if (!botaoEditar) {
    return;
  }

  const idProduto = Number(botaoEditar.dataset.id);

  const produto = produtosCarregados.find(
    item => Number(item.id) === idProduto
  );

  if (!produto) {
    alert("Produto não encontrado.");
    return;
  }

  produtoEmEdicaoId = produto.id;

  document.getElementById("produtoCodigo").value = produto.codigo || "";
  document.getElementById("produtoNome").value = produto.nome || "";
  document.getElementById("produtoPreco").value = produto.preco || "";
  document.getElementById("produtoCategoria").value = produto.categoria || "";
  document.getElementById("produtoEstoque").value = produto.estoque ?? 0;
  document.getElementById("produtoDisponivel").checked = produto.disponivel;
  document.getElementById("produtoDestaque").checked = produto.destaque;

  formNovoProduto.querySelector("h3").textContent = "Editar produto";
  document.querySelector('#novoProdutoForm button[type="submit"]').textContent = "Salvar alterações";

  formNovoProduto.style.display = "block";
  formNovoProduto.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
});

document.getElementById("btnNovoProduto").addEventListener("click", () => {
  produtoEmEdicaoId = null;
document.getElementById("novoProdutoForm").reset();
document.getElementById("produtoDisponivel").checked = true;
formNovoProduto.querySelector("h3").textContent = "Novo produto";
document.querySelector('#novoProdutoForm button[type="submit"]').textContent = "Salvar produto";
  formNovoProduto.style.display = "block";
  
  document.getElementById("produtoCodigo").focus();
});

document.getElementById("btnCancelarProduto").addEventListener("click", () => {
  produtoEmEdicaoId = null;
formNovoProduto.querySelector("h3").textContent = "Novo produto";
document.querySelector('#novoProdutoForm button[type="submit"]').textContent = "Salvar produto";
  formNovoProduto.style.display = "none";
  document.getElementById("novoProdutoForm").reset();
  document.getElementById("produtoDisponivel").checked = true;
});
</script>
</body>
</html>
